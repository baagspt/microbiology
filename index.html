<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Gudang Mikrobiologi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .rak-circle-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: all 0.2s;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar Navigasi Rak -->
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <h1 class="text-lg font-bold text-gray-800"><i class="fa-solid fa-boxes-stacked mr-2 text-blue-600"></i>Gudang Lab</h1>
            </div>
            <div class="p-4 flex-1 overflow-y-auto">
                <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Daftar Rak</h2>
                <div id="left-rak-nav" class="space-y-2">
                    <!-- Tombol Navigasi Rak akan dirender secara dinamis -->
                </div>
            </div>
        </aside>

        <!-- Area Konten Utama -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <!-- Header Atas -->
            <header class="bg-white border-b border-gray-200 p-4 flex justify-between items-center">
                <h2 id="current-rak-title" class="text-xl font-bold text-gray-800">Memuat Rak...</h2>
                <div class="flex items-center space-x-3">
                    <input type="text" id="global-search" placeholder="Cari produk..." class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </header>

            <!-- Konten Rak & Lantai -->
            <div class="flex-1 overflow-y-auto p-6">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- Visualisasi Rak -->
                    <div class="bg-white p-6 rounded-xl border border-gray-200 flex flex-col items-center justify-center">
                        <h3 class="text-md font-semibold text-gray-700 mb-4">Visualisasi Rak</h3>
                        <div id="rak-image-container" class="w-full flex justify-center">
                            <!-- Gambar/Preview Rak -->
                            <div class="text-gray-400 text-sm">Memuat visual...</div>
                        </div>
                    </div>

                    <!-- Detail Lantai / Rak -->
                    <div class="lg:col-span-2 bg-white p-6 rounded-xl border border-gray-200">
                        <h3 class="text-md font-semibold text-gray-700 mb-4">Detail Lantai Rak</h3>
                        <div id="floors-container" class="space-y-4">
                            <!-- Detail lantai akan dirender di sini -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Konfigurasi Supabase (Ganti dengan URL dan Key proyek Anda)
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function defaultFloors() {
            return [
                { id: 1, name: "Lantai 1", items: [] },
                { id: 2, name: "Lantai 2", items: [] },
                { id: 3, name: "Lantai 3", items: [] },
                { id: 4, name: "Lantai 4", items: [] },
                { id: 5, name: "Lantai 5", items: [] },
                { id: 6, name: "Lantai 6", items: [] }
            ];
        }

        let dataGudang = [
            { id: 1, nama: "Rak 1", floors: defaultFloors() },
            { id: 2, nama: "Rak 2", floors: defaultFloors() },
            { id: 3, nama: "Rak 3", floors: defaultFloors() },
            { id: 4, nama: "Rak 4", floors: defaultFloors() },
            { id: 5, nama: "Rak 5", floors: defaultFloors() },
            { id: 6, nama: "Rak 6", floors: defaultFloors() }
        ];

        let currentRakIndex = 0;
        const availableImageFiles = ['0000.png', '1000.png', '0100.png', '1100.png']; // Contoh file gambar referensi

        function getFloorEntries(floor) {
            return floor.items || [];
        }

        function getRackImage(rak) {
            const code = rak.floors
                .slice(0, 4)
                .map((floor, index) => getFloorEntries(floor).some(entry => entry.product) ? String(index + 1) : '0')
                .join('');
            const fileName = `${code}.png`;
            return availableImageFiles.includes(fileName) ? fileName : '0000.png';
        }

        function renderNav() {
            const navContainer = document.getElementById('left-rak-nav');
            navContainer.innerHTML = '';
            dataGudang.forEach((rak, index) => {
                const btn = document.createElement('button');
                btn.className = `rak-circle-btn w-full justify-start px-4 py-2 rounded-lg text-sm ${currentRakIndex === index ? 'bg-blue-600 text-white' : 'bg-gray-50 text-gray-700 hover:bg-gray-100'}`;
                btn.innerHTML = `<i class="fa-solid fa-cube mr-2"></i> ${rak.nama}`;
                btn.onclick = () => {
                    currentRakIndex = index;
                    renderApp();
                };
                navContainer.appendChild(btn);
            });
        }

        function renderApp() {
            renderNav();
            const rak = dataGudang[currentRakIndex];
            document.getElementById('current-rak-title').innerText = rak.nama;

            // Render Gambar / Preview
            const imgContainer = document.getElementById('rak-image-container');
            const imgName = getRackImage(rak);
            imgContainer.innerHTML = `<div class="p-4 border rounded bg-gray-50 text-center text-sm text-gray-600">Status Gambar Rak: <b>${imgName}</b></div>`;

            // Render Lantai
            const floorsContainer = document.getElementById('floors-container');
            floorsContainer.innerHTML = '';
            rak.floors.forEach((floor, fIndex) => {
                const floorDiv = document.createElement('div');
                floorDiv.className = 'p-4 border border-gray-200 rounded-lg bg-gray-50';
                floorDiv.innerHTML = `
                    <div class="font-semibold text-gray-700 mb-2">${floor.name}</div>
                    <div class="text-sm text-gray-500">Jumlah item: ${floor.items.length}</div>
                `;
                floorsContainer.appendChild(floorDiv);
            });
        }

        // Inisialisasi awal
        document.addEventListener('DOMContentLoaded', () => {
            renderApp();

            // Setup Realtime Listener Supabase
            _supabase
                .channel('public:Microbiology')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'Microbiology' }, payload => {
                    console.log('Perubahan data terdeteksi:', payload);
                    // Tambahkan logika sinkronisasi data di sini jika diperlukan
                })
                .subscribe();
        });
    </script>
</body>
</html>
